<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oak Year — a seasonal field guide to the oak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..600;1,7..72,400&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<!--
================================================================================
 OAK YEAR — ARCHITECTURE NOTES
================================================================================
 Everything lives in this one file, but it is organised as independent layers
 so each can grow (or be moved to its own file) without touching the others.

 1. DATA (JSON blocks in <script type="application/json">)
    #oak-content   topics → seasons → levels → text. Swap for a fetched JSON
                   file later; the schema is the contract.
    #oak-glossary  term → definition + match forms. Terms are auto-linked.
    #oak-months    one short phenology note per month.

 2. CONFIG          LEVELS, SEASONS, PHENOLOGY keyframes (12 months per channel).
                   Add a level: append to LEVELS and add its text in content.
                   Missing text falls back to the nearest lower level.
                   Add a phenology channel: add 12 values, read it in Scene.

 3. STORE           Single source of truth {month, level, topic, playing}.
                   Modules subscribe; nothing talks to the DOM of another module.

 4. SCENE           Procedural, seeded tree (deterministic). Pure render of
                   phenology → SVG attributes. Swap renderer (canvas/WebGL)
                   without touching content.

 5. TOPICS          App.registerTopic({id, focus, illustrate}). A topic is a
                   zoom target + an illustration function + content key.
                   Illustrations are pure functions ctx → SVG string;
                   ctx.mark() adds a numbered, level-aware legend entry.

 6. UI              Panel, timeline, level switch, glossary tooltips.

 Ideas this structure is ready for: more topics (galls, insects, lichens),
 deeper zoom layers per topic, quiz mode per level, other species packs,
 translations (STRINGS + content per locale), deep links.
================================================================================
-->
<style>
:root{
  --bg:#E6EBE2; --surface:#F2F4EE; --surface-2:#DCE3D5; --ink:#1D241A; --muted:#5C6656;
  --line:#C6CEBD; --line-strong:#97A28C;
  --trunk:#4B3C2F; --root:#6E5644; --soil-top:#CBBDA2; --soil-bot:#A28F72; --hypha:#FBF8EF;
  --accent:#4F7A3A;
  --serif:"Literata", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans:"Schibsted Grotesk", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --panel-w:440px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11150F; --surface:#171C14; --surface-2:#20281C; --ink:#E1E6D8; --muted:#97A18C;
    --line:#2A3325; --line-strong:#46523E;
    --trunk:#86705C; --root:#7E6855; --soil-top:#2B251D; --soil-bot:#1A1612; --hypha:#D8D1BE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11150F; --surface:#171C14; --surface-2:#20281C; --ink:#E1E6D8; --muted:#97A18C;
  --line:#2A3325; --line-strong:#46523E;
  --trunk:#86705C; --root:#7E6855; --soil-top:#2B251D; --soil-bot:#1A1612; --hypha:#D8D1BE;
  color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  height:100%; margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.45;
  display:grid; grid-template-rows:auto 1fr; -webkit-font-smoothing:antialiased;
}
button{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; border-radius:4px; }

/* ---------- Header ---------- */
.top{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:14px 24px; border-bottom:1px solid var(--line);
}
.brand{ display:flex; align-items:center; gap:12px; min-width:0; }
.brand svg{ flex:none; }
.brand-title{ font-family:var(--serif); font-size:21px; font-weight:500; letter-spacing:-0.01em; margin:0; line-height:1.1; }
.brand-sub{ margin:2px 0 0; color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brand-sub i{ font-family:var(--serif); }

.levels{ display:flex; align-items:center; gap:10px; }
.levels-label{ color:var(--muted); font-size:13px; }
.seg{ display:flex; background:var(--surface-2); border-radius:999px; padding:3px; }
.seg button{
  border:0; background:transparent; padding:6px 13px; border-radius:999px; cursor:pointer;
  font-size:13px; font-weight:500; color:var(--muted); white-space:nowrap;
  transition:background .2s, color .2s;
}
.seg button[aria-checked="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--line); }
.seg .short{ display:none; }

/* ---------- Main layout ---------- */
.main{ display:grid; grid-template-columns:minmax(0,1fr) var(--panel-w); min-height:0; }
.stage{ position:relative; display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden; }
.scene-wrap{ position:relative; flex:1; min-height:0; }
#scene{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:manipulation; }

.moment{ position:absolute; left:28px; top:22px; max-width:min(330px, 60%); pointer-events:none; z-index:2; transition:opacity .35s; }
.moment.off{ opacity:0; }
.moment-month{
  font-family:var(--serif); font-weight:300; font-size:clamp(44px, 6vw, 76px); line-height:.95;
  letter-spacing:-0.03em; margin:0; font-variation-settings:"opsz" 72;
}
.moment-season{ margin:10px 0 4px; font-size:13px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:8px; }
.moment-season::before{ content:""; width:9px; height:9px; border-radius:50%; background:var(--accent); transition:background .4s; }
.moment-note{ margin:0; color:var(--muted); font-size:14px; line-height:1.45; }

.back{
  position:absolute; right:18px; top:18px; z-index:3;
  border:1px solid var(--line); background:var(--surface); border-radius:999px;
  padding:7px 14px 7px 11px; font-size:13px; font-weight:500; cursor:pointer;
  display:flex; align-items:center; gap:6px;
  opacity:0; transform:translateY(-4px); pointer-events:none; transition:opacity .25s, transform .25s;
}
.back.on{ opacity:1; transform:none; pointer-events:auto; }

/* Hotspots (HTML overlay so labels stay readable at any zoom) */
.hotspots{ position:absolute; inset:0; pointer-events:none; z-index:2; transition:opacity .3s; }
.hotspots.off{ opacity:0; }
.hotspots.off .hs{ pointer-events:none; }
.hs{
  position:absolute; left:0; top:0; pointer-events:auto; cursor:pointer;
  display:flex; align-items:center; gap:7px; border:0; background:none; padding:0;
  transform:translate(-11px,-11px);
}
.hs-dot{
  width:22px; height:22px; border-radius:50%; position:relative; flex:none;
  background:var(--surface); box-shadow:0 0 0 1.5px var(--ink) inset;
}
.hs-dot::after{ content:""; position:absolute; inset:6px; border-radius:50%; background:var(--ink); transition:inset .2s; }
.hs:hover .hs-dot::after, .hs:focus-visible .hs-dot::after{ inset:4px; }
.hs-label{
  font-size:12.5px; font-weight:500; background:var(--surface); padding:3px 9px; border-radius:6px;
  box-shadow:0 0 0 1px var(--line); white-space:nowrap;
}
.hs-label.left{ order:-1; }
.hs.flip{ flex-direction:row-reverse; transform:translate(calc(-100% + 11px),-11px); }

/* ---------- Timeline ---------- */
.timeline{
  display:grid; grid-template-columns:auto 1fr; gap:4px 16px; align-items:center;
  padding:12px 28px 18px; border-top:1px solid var(--line);
}
.play{
  grid-row:span 2; width:40px; height:40px; border-radius:50%; border:1px solid var(--line-strong);
  background:var(--surface); cursor:pointer; display:grid; place-items:center;
}
.play svg{ width:14px; height:14px; fill:var(--ink); }
.range{ position:relative; height:26px; display:flex; align-items:center; }
.range input{ width:100%; margin:0; appearance:none; -webkit-appearance:none; background:transparent; height:26px; cursor:pointer; }
.range input::-webkit-slider-runnable-track{ height:4px; border-radius:2px; background:var(--line); }
.range input::-moz-range-track{ height:4px; border-radius:2px; background:var(--line); }
.range input::-webkit-slider-thumb{
  -webkit-appearance:none; width:20px; height:20px; border-radius:50%; margin-top:-8px;
  background:var(--accent); border:3px solid var(--surface); box-shadow:0 0 0 1px var(--line-strong);
}
.range input::-moz-range-thumb{
  width:14px; height:14px; border-radius:50%; background:var(--accent); border:3px solid var(--surface); box-shadow:0 0 0 1px var(--line-strong);
}
.months{ display:grid; grid-template-columns:repeat(12,1fr); }
.months button{
  border:0; background:none; padding:2px 0; cursor:pointer; color:var(--muted);
  font-size:12px; text-align:center; border-radius:4px;
}
.months button[aria-current="true"]{ color:var(--ink); font-weight:600; }

/* ---------- Panel ---------- */
.panel{ border-left:1px solid var(--line); background:var(--surface); overflow-y:auto; min-height:0; }
.panel-inner{ padding:26px 28px 40px; }
.panel-inner.enter{ animation:enter .35s ease both; }
@keyframes enter{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }

.crumb{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
.link{
  border:0; background:none; padding:4px 0; cursor:pointer; color:var(--muted); font-size:13px; font-weight:500;
  display:inline-flex; align-items:center; gap:5px;
}
.link:hover{ color:var(--ink); }
.when{ color:var(--muted); font-size:13px; }

.panel h2{
  font-family:var(--serif); font-weight:400; font-size:34px; line-height:1.05; letter-spacing:-0.02em;
  margin:0 0 6px; font-variation-settings:"opsz" 48;
}
.lede{ margin:0 0 18px; color:var(--muted); font-size:14px; }

figure.ill{ margin:0 0 6px; background:var(--bg); border-radius:14px; padding:10px 8px 6px; }
figure.ill svg{ display:block; width:100%; height:auto; }
.legend{ list-style:none; margin:8px 2px 0; padding:0; display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12.5px; color:var(--muted); counter-reset:lg; }
.legend li{ counter-increment:lg; display:flex; gap:6px; align-items:baseline; }
.legend li::before{
  content:counter(lg); flex:none; width:16px; height:16px; border-radius:50%; background:var(--ink); color:var(--surface);
  font-size:10px; font-weight:600; display:inline-grid; place-items:center; transform:translateY(2px);
}

.follow{ margin:20px 0 4px; }
.follow-label{ font-size:13px; color:var(--muted); margin:0 0 8px; }
.tabs{ display:grid; grid-template-columns:repeat(4,1fr); gap:4px; background:var(--surface-2); border-radius:10px; padding:3px; }
.tabs button{ border:0; background:none; border-radius:8px; padding:7px 0; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer; }
.tabs button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--line); }

.reading{ margin-top:22px; }
.reading-level{ font-size:13px; font-weight:600; margin:0 0 6px; display:flex; align-items:center; gap:8px; }
.pips{ display:inline-flex; gap:3px; }
.pips i{ width:14px; height:4px; border-radius:2px; background:var(--line); }
.pips i.on{ background:var(--ink); }
.reading p.text{
  font-family:var(--serif); font-size:16.5px; line-height:1.68; margin:0; max-width:62ch;
  font-variation-settings:"opsz" 16;
}
.depth{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
.chip{
  border:1px solid var(--line-strong); background:transparent; border-radius:999px; padding:6px 13px;
  font-size:13px; font-weight:500; cursor:pointer;
}
.chip:hover{ background:var(--surface-2); }
.chip.primary{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
.chip.primary:hover{ opacity:.88; background:var(--ink); }

.related{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
.related p{ margin:0 0 8px; font-size:13px; color:var(--muted); }

.term{
  border:0; background:none; padding:0; font:inherit; color:inherit; cursor:help;
  text-decoration:underline; text-decoration-style:dotted; text-decoration-color:var(--line-strong);
  text-underline-offset:3px; text-decoration-thickness:1.5px;
}
.term:hover{ text-decoration-color:var(--ink); }
#tip{
  position:fixed; z-index:20; max-width:280px; background:var(--ink); color:var(--surface);
  padding:10px 12px; border-radius:10px; font-size:13px; line-height:1.45; pointer-events:none;
  opacity:0; transform:translateY(4px); transition:opacity .15s, transform .15s;
}
#tip.on{ opacity:1; transform:none; }
#tip b{ display:block; font-family:var(--serif); font-weight:500; font-size:15px; margin-bottom:2px; }

/* Intro view */
.intro h2{ font-size:30px; }
.intro .lede{ font-family:var(--serif); font-size:16px; line-height:1.6; color:var(--ink); }
.topic-list{ list-style:none; margin:22px 0 0; padding:0; border-top:1px solid var(--line); }
.topic-list button{
  width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); background:none; cursor:pointer;
  display:grid; grid-template-columns:auto 1fr auto; gap:2px 14px; align-items:center; padding:13px 2px;
}
.topic-list button:hover .tl-name{ text-decoration:underline; text-underline-offset:3px; }
.tl-glyph{ grid-row:span 2; width:34px; height:34px; border-radius:50%; background:var(--surface-2); display:grid; place-items:center; }
.tl-glyph svg{ width:20px; height:20px; }
.tl-name{ font-weight:600; font-size:14.5px; }
.tl-blurb{ grid-column:2; color:var(--muted); font-size:13px; }
.tl-arrow{ grid-row:span 2; grid-column:3; color:var(--muted); }
.hint{ margin-top:18px; font-size:13px; color:var(--muted); }

/* Illustration styling */
.ill .mag-bg{ fill:var(--surface); }
.ill .mag-ring{ fill:none; stroke:var(--ink); stroke-width:1.5; }
.ill .loupe{ fill:none; stroke:var(--ink); stroke-width:1; stroke-dasharray:3 3; opacity:.6; }
.ill .mk circle{ fill:var(--ink); stroke:var(--bg); stroke-width:2; }
.ill .mk text{ fill:var(--bg); font:600 9.5px var(--sans); text-anchor:middle; }
.ill .twig{ stroke:var(--trunk); fill:none; stroke-linecap:round; }

/* ---------- Scene styling ---------- */
.br{ stroke:var(--trunk); fill:none; stroke-linecap:round; }
.flare{ fill:var(--trunk); }
.rt{ stroke:var(--root); fill:none; stroke-linecap:round; }
.hy{ stroke:var(--hypha); fill:none; stroke-width:.8; }
.focus-ring{ fill:none; stroke:var(--ink); stroke-width:1.6; stroke-dasharray:4 4; opacity:0; transition:opacity .4s .5s; vector-effect:non-scaling-stroke; }
.focus-ring.on{ opacity:.75; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px){ :root{ --panel-w:380px; } .levels-label{ display:none; } }
@media (max-width: 860px){
  body{ height:auto; display:block; }
  .main{ display:block; }
  .stage{ height:70svh; min-height:440px; }
  .panel{ border-left:0; border-top:1px solid var(--line); overflow:visible; }
  .panel-inner{ padding:24px 20px 48px; }
  .top{ padding:12px 16px; flex-wrap:wrap; }
  .brand-sub{ display:none; }
  .seg .long{ display:none; } .seg .short{ display:inline; }
  .seg button{ padding:6px 11px; }
  .moment{ left:18px; top:14px; }
  .moment-note{ font-size:13px; }
  .timeline{ padding:10px 16px 14px; gap:2px 12px; }
  .hs-label{ font-size:12px; }
}
@media (max-width: 420px){ .moment-note{ display:none; } }
@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path id="brandLeaf" fill="var(--accent)"/></svg>
    <div>
      <h1 class="brand-title">Oak Year</h1>
      <p class="brand-sub">A seasonal field guide to the pedunculate oak, <i>Quercus robur</i></p>
    </div>
  </div>
  <div class="levels">
    <span class="levels-label" id="levelsLabel">Reading level</span>
    <div class="seg" role="radiogroup" aria-labelledby="levelsLabel" id="levelSeg"></div>
  </div>
</header>

<div class="main">
  <section class="stage" aria-label="Oak tree through the year">
    <div class="scene-wrap" id="sceneWrap">
      <svg id="scene" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="An oak tree shown in the selected month"></svg>
      <div class="moment" aria-live="polite">
        <p class="moment-month" id="mMonth">May</p>
        <p class="moment-season" id="mSeason">Spring</p>
        <p class="moment-note" id="mNote"></p>
      </div>
      <div class="hotspots" id="hotspots"></div>
      <button class="back" id="backBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Whole tree
      </button>
    </div>
    <div class="timeline">
      <button class="play" id="playBtn" type="button" aria-label="Play the year"></button>
      <div class="range"><input id="monthRange" type="range" min="0" max="11.99" step="0.01" aria-label="Time of year"></div>
      <div class="months" id="monthBtns"></div>
    </div>
  </section>

  <aside class="panel" id="panel" aria-live="polite">
    <div class="panel-inner" id="panelInner"></div>
  </aside>
</div>
<div id="tip" role="tooltip"></div>

<!-- ======================= DATA: CONTENT ======================= -->
<script type="application/json" id="oak-content">
{
  "species": { "common": "Pedunculate oak", "latin": "Quercus robur" },
  "topics": {
    "leaves": {
      "name": "Leaves",
      "blurb": "Solar panels that change with the seasons",
      "related": ["buds", "wood", "roots"],
      "seasons": {
        "spring": {
          "ms": "In late April and May the oak’s buds burst open and soft little leaves unfold. They often look reddish or pale at first, because they haven’t finished building their green color. Within a few weeks they toughen up and turn deep green, ready to make food from sunlight.",
          "hs": "New leaves grow quickly after budburst, mostly by their cells expanding. The reddish tint comes from anthocyanin pigments, which act like sunscreen while chlorophyll and the rest of the light-harvesting machinery are still being built. Young leaves are soft and protein-rich, which is why winter moth caterpillars time their hatching to oak budburst.",
          "college": "Leaf expansion draws on carbohydrate and nitrogen reserves stored over winter, so young leaves are sinks before they become sources of photosynthate. Anthocyanins in juvenile leaves likely provide photoprotection while chloroplasts are immature. Young oak leaves are low in tannins and high in nitrogen; tannin content and toughness then rise through the season, making leaves less palatable to herbivores, a classic result from Paul Feeny’s work on Quercus robur.",
          "phd": "Leaf-out integrates chilling and forcing; Q. robur responds strongly to spring forcing temperature and comparatively weakly to photoperiod, so its phenology has advanced markedly under warming. The sink-to-source transition coincides with completion of chloroplast biogenesis and vein-network maturation. Feeny (1970) showed that the seasonal rise in condensed tannins and toughness, with falling leaf N, confines Operophtera brumata to a narrow phenological window, now a model system for climate-driven trophic mismatch."
        },
        "summer": {
          "ms": "In summer the leaves work like solar panels. They take in carbon dioxide from the air through tiny pores, get water from the roots, and use sunlight to turn them into sugar. Oxygen is released as a bonus: a big oak gives off a lot of it on a sunny day.",
          "hs": "Photosynthesis happens in chloroplasts, mostly in the tightly packed palisade cells just under the upper surface. CO₂ enters through stomata on the underside of the leaf, and guard cells close them during drought to save water. Leaves on the sunny outside of the crown are smaller and thicker (sun leaves) than the broad, thin shade leaves inside.",
          "college": "Oak is a C3 plant: Rubisco fixes CO₂ in the Calvin cycle, and photorespiration increases on hot days as O₂ competes for the enzyme’s active site. Stomatal conductance trades carbon gain against water loss and responds strongly to vapour-pressure deficit. Many oaks put out a second flush of shoots in midsummer, called Lammas growth, which can replace leaves lost to caterpillars.",
          "phd": "Compared with beech, Q. robur tends toward a more anisohydric strategy, keeping stomata open to lower leaf water potentials, supported by deep rooting. Oaks are among the strongest isoprene emitters in temperate forests: isoprene, made via the plastidic MEP pathway from recent photosynthate, is thought to stabilise thylakoid membranes and quench reactive oxygen species under heat stress, while feeding tropospheric ozone and secondary organic aerosol formation."
        },
        "autumn": {
          "ms": "As days get shorter and nights colder, the oak takes back useful nutrients from its leaves before dropping them. The green fades and yellows and browns show through. Oak leaves often turn a warm brown and fall later than those of many other trees.",
          "hs": "The tree breaks down chlorophyll so it can recover the nitrogen inside it. As the green disappears, yellow carotenoids that were there all along become visible, and oxidised tannins give oak its typical brown. A special layer of cells at the base of the leaf stalk, the abscission zone, weakens until the leaf falls.",
          "college": "Senescence is a regulated, programmed process: chloroplasts are dismantled first, and roughly half of the leaf’s nitrogen and phosphorus is resorbed into twigs and stems for reuse. Chlorophyll is degraded via the PAO pathway into colourless catabolites. Abscission requires cell-wall-degrading enzymes in the separation layer, triggered as auxin flow from the leaf falls and sensitivity to ethylene rises.",
          "phd": "Senescence timing integrates photoperiod and temperature, but also sink limitation: higher growing-season productivity can advance autumn senescence (Zani et al. 2020, Science), complicating simple predictions that warming delays leaf fall. Chlorophyll catabolism proceeds via pheophorbide a oxygenase (PAO) to nonfluorescent catabolites stored in the vacuole. In juvenile oaks the abscission layer often fails to complete, producing marcescence."
        },
        "winter": {
          "ms": "In winter the oak has no green leaves, so it rests. Young oaks sometimes keep their dry brown leaves until spring, and you can hear them rustle in the wind. The leaves that fell are being eaten by worms, fungi and bacteria, which return their nutrients to the soil.",

function rgb2hex(r){ return "#" + r.map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, "0")).join(""); }
function mix(a, b, t){ const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A.map((v, i) => lerp(v, B[i], t))); }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function el(tag, attrs = {}, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
const readJSON = id => JSON.parse(document.getElementById(id).textContent);

};

/* Phenology keyframes: one value per month (mid-month). Temperate N. Europe. */
const PHENOLOGY = {
  leaf:        [0, 0, 0, .08, .78, 1, 1, 1, .97, .8, .22, 0],
  leafColor:   ["#8a5a35","#8a5a35","#8a5a35","#b4bd62","#93b04c","#5a8f3f","#447d36","#3f7333","#6c8a37","#c28a2c","#9a6232","#8a5a35"],
  catkin:      [0, 0, 0, .2, 1, .12, 0, 0, 0, 0, 0, 0],
  acorn:       [0, 0, 0, 0, 0, .25, .6, .85, 1, .65, .1, 0],
  acornRipe:   [1, 1, 1, 0, 0, 0, 0, .1, .55, 1, 1, 1],
  acornGround: [.35, .25, .15, 0, 0, 0, 0, 0, .3, 1, .8, .5],
  snow:        [1, .75, .15, 0, 0, 0, 0, 0, 0, 0, .1, .6],
  snowfall:    [1, .7, .1, 0, 0, 0, 0, 0, 0, 0, .15, .8],
  leafFall:    [0, 0, 0, 0, 0, 0, 0, 0, .15, .9, .7, 0],
  mushroom:    [0, 0, 0, 0, 0, 0, 0, .1, .5, 1, .4, 0],
  hyphae:      [.35, .35, .45, .6, .8, .9, 1, 1, .95, .85, .6, .4],
  grass:       ["#a39e86","#a39e86","#9fa071","#96ad5e","#7fa64d","#6f9a46","#6f9443","#7c8f45","#8d8c4c","#9a8a52","#958b63","#a39e86"]
};
const WINTER_ACCENT = "#6d8797";

const Phenology = {
  at(m){
    const p = ((m - 0.5) % 12 + 12) % 12;
    const i = Math.floor(p), j = (i + 1) % 12, t = smooth(p - i);
    const out = {};
    for (const k in PHENOLOGY){
      const a = PHENOLOGY[k][i], b = PHENOLOGY[k][j];
      out[k] = typeof a === "string" ? mix(a, b, t) : lerp(a, b, t);
    }
    out.accent = mix(WINTER_ACCENT, out.leafColor, clamp(out.leaf * 2.2));
    return out;
  }
};
const seasonOf = m => MONTH_SEASON[Math.floor(((m % 12) + 12) % 12)];

/* =========================================================================
   STORE — single source of truth
   ========================================================================= */
function createStore(initial){
  let state = initial; const subs = new Set();
  return {
    get: () => state,
    set(patch){ const prev = state; state = { ...state, ...patch }; subs.forEach(f => f(state, prev)); },
    subscribe(f){ subs.add(f); return () => subs.delete(f); }
  };
}

});

/* =========================================================================
   GEOMETRY — seeded, deterministic tree + roots
   ========================================================================= */
function growTree(R){
  const segs = [], tips = [];
  const { maxDepth, trunkLen, trunkWidth } = CONFIG.tree;
  (function br(x, y, a, len, w, d){
    const bend = d < 2 ? (R() - .5) * .15 : (R() - .5) * .6;
    const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
    const cx = x + Math.cos(a + bend) * len * .55, cy = y + Math.sin(a + bend) * len * .55;
    segs.push({ x, y, cx, cy, x2, y2, w, d, a });
    if (d >= maxDepth){ tips.push({ x: x2, y: y2, a, d }); return; }
    if (d >= maxDepth - 2) tips.push({ x: x2, y: y2, a, d });
    const n = d === 0 ? 3 : (R() < .35 ? 3 : 2);
    const spread = d < 2 ? 1.0 : .56;
    for (let i = 0; i < n; i++){
      let na = a + (i - (n - 1) / 2) * spread * (.8 + R() * .5) + (R() - .5) * .3;
      na += (-Math.PI / 2 - na) * .04;
      na = clamp(na, -Math.PI + .08, -.08);
      br(x2, y2, na, len * (d === 0 ? .82 : .7 + R() * .09), Math.max(1, w * (n === 3 ? .6 : .68)), d + 1);
    }
  })(CONFIG.world.cx, CONFIG.world.ground, -Math.PI / 2, trunkLen, trunkWidth, 0);
  return { segs, tips };
}
function growRoots(R){
  const segs = [], tips = [];
  const G = CONFIG.world.ground;
  const starts = [.06, .22, .4, .6, .78, .94];
  starts.forEach((f, k) => {
    const a = Math.PI * f;
    (function br(x, y, a, len, w, d){
      a = clamp(a, .04, Math.PI - .04);
      const x2 = x + Math.cos(a) * len, y2 = Math.max(G + 6, y + Math.sin(a) * len);
      const bend = (R() - .5) * .7;
      const cx = x + Math.cos(a + bend) * len * .5, cy = Math.max(G + 4, y + Math.sin(a + bend) * len * .5);
      segs.push({ x, y, cx, cy, x2, y2, w, d });
      if (d >= 4){ tips.push({ x: x2, y: y2, a }); return; }
      const n = R() < .3 ? 3 : 2;
      for (let i = 0; i < n; i++){
        const na = a + (i - (n - 1) / 2) * .6 + (R() - .5) * .5 + .08;
        br(x2, y2, na, len * (.72 + R() * .12), Math.max(.8, w * .6), d + 1);
      }
    })(CONFIG.world.cx + (f - .5) * 40, G + 4, a, 62 + R() * 18, 13 - Math.abs(f - .5) * 6, 0);
  });
  return { segs, tips };
}

/* =========================================================================
   SCENE — renders the whole tree from phenology
   ========================================================================= */
const Scene = (() => {
  const svg = $("#scene");
  const R = mulberry32(CONFIG.seed);
  const G = CONFIG.world.ground;
  let tree, roots, leafEls = [], leafGroups = [], acornEls = [], groundAcorns = [], mushrooms = [], parts = {};
  const focusPoints = {};

  function nearest(list, x, y){
    let best = list[0], bd = Infinity;
    for (const p of list){ const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < bd){ bd = d; best = p; } }
    return best;
  }
  const qpath = s => `M${f1(s.x)} ${f1(s.y)}Q${f1(s.cx)} ${f1(s.cy)} ${f1(s.x2)} ${f1(s.y2)}`;

  function build(){
    tree = growTree(R); roots = growRoots(R);
    svg.innerHTML = "";
    const defs = el("defs", {}, svg);
    defs.innerHTML = `
      <linearGradient id="soilGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--soil-top)"/><stop offset=".55" style="stop-color:var(--soil-bot)"/>
        <stop offset="1" style="stop-color:var(--bg)"/>
      </linearGradient>
      <radialGradient id="glowGrad"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></radialGradient>`;
    el("circle", { cx: 600, cy: 300, r: 560, fill: "url(#glowGrad)" }, svg);

    /* ground + soil cutaway */
    el("rect", { x: -3000, y: G, width: 7200, height: 520, fill: "url(#soilGrad)" }, svg);
    const rootG = el("g", { id: "roots" }, svg);
    roots.segs.forEach(s => el("path", { d: qpath(s), class: "rt", "stroke-width": f1(s.w) }, rootG));
    parts.hyphae = el("g", {}, svg);
    roots.tips.forEach(t => {
      for (let i = 0; i < 4; i++){
        const a = t.a + (R() - .5) * 2.4, L = 10 + R() * 16;
        const mx = t.x + Math.cos(a) * L * .5 + (R() - .5) * 6, my = t.y + Math.sin(a) * L * .5 + (R() - .5) * 6;
        el("path", { d: `M${f1(t.x)} ${f1(t.y)}Q${f1(mx)} ${f1(my)} ${f1(t.x + Math.cos(a) * L)} ${f1(t.y + Math.sin(a) * L)}`, class: "hy" }, parts.hyphae);
      }
    });
    parts.grass = el("rect", { x: -3000, y: G - 3, width: 7200, height: 6 }, svg);
    parts.snowGround = el("rect", { x: -3000, y: G - 9, width: 7200, height: 12, rx: 6, fill: "#f7faf9" }, svg);

    /* fallen acorns + mushrooms */
    const ga = el("g", {}, svg);
    for (let i = 0; i < 14; i++){
      const x = 440 + R() * 320, t = R();
      const e = el("ellipse", { cx: f1(x), cy: G - 2.5, rx: 3, ry: 2.2, fill: "#7a4e26", transform: `rotate(${f1(R() * 60 - 30)} ${f1(x)} ${G - 2})` }, ga);
      groundAcorns.push({ e, t });
    }
    const mg = el("g", {}, svg);
    [[452, 1], [470, .7], [748, .85], [905, .6]].forEach(([x, s]) => {
      const g = el("g", {}, mg);
      g.innerHTML = `<rect x="-1.8" y="-10" width="3.6" height="10" rx="1.5" fill="#efe5d0"/><path d="M-9 -9 Q0 -21 9 -9 Z" fill="#8b5a2b"/>`;
      mushrooms.push({ g, x, s });
    });

    /* tree */
    const trunkG = el("g", { id: "tree" }, svg);
    const cx = CONFIG.world.cx;
    el("path", { class: "flare", d: `M${cx - 58} ${G + 2}Q${cx - 26} ${G - 6} ${cx - 22} ${G - 70}L${cx + 22} ${G - 70}Q${cx + 28} ${G - 6} ${cx + 62} ${G + 2}Z` }, trunkG);
    tree.segs.forEach(s => el("path", { d: qpath(s), class: "br", "stroke-width": f1(s.w) }, trunkG));

    /* snow on branches */
    parts.snowBr = el("g", { fill: "none", stroke: "#f7faf9", "stroke-linecap": "round" }, svg);
    tree.segs.filter(s => s.d <= 5 && s.d >= 1 && Math.abs(Math.cos(s.a)) > .35).forEach(s => {
      el("path", { d: qpath(s), "stroke-width": f1(Math.max(1.4, s.w * .38)), transform: `translate(0 ${f1(-s.w * .42)})` }, parts.snowBr);
    });

    /* focus points for topics (picked from geometry) */
    focusPoints.leaves = nearest(tree.tips, 760, 200);
    focusPoints.buds = nearest(tree.tips, 340, 300);
    focusPoints.flowers = nearest(tree.tips, 920, 400);
    focusPoints.acorns = nearest(tree.tips, 470, 330);
    focusPoints.wood = { x: cx, y: G - 60 };
    focusPoints.roots = nearest(roots.tips, 700, 770);

    /* leaves */
    const leafRoot = el("g", { id: "leaves" }, svg);
    leafGroups = [0, 1, 2].map(() => el("g", {}, leafRoot));
    tree.tips.forEach(t => {
      const n = t.d >= CONFIG.tree.maxDepth ? 3 : 2;
      for (let i = 0; i < n; i++){
        const r0 = 7 + R() * 8, sh = Math.floor(R() * 3);
        const c = el("circle", { cx: f1(t.x + (R() - .5) * 26), cy: f1(t.y + (R() - .5) * 22 - 3), r: r0 }, leafGroups[sh]);
        leafEls.push({ c, r0, t: R() });
      }
    });

    /* catkins */
    parts.catkins = el("g", { fill: "none", stroke: "#c4b04a", "stroke-width": 2.4, "stroke-linecap": "round", "stroke-dasharray": "0.1 2.7" }, svg);
    tree.tips.forEach(t => {
      const near = Math.hypot(t.x - focusPoints.flowers.x, t.y - focusPoints.flowers.y) < 70;
      if (!(near || R() < .3)) return;
      for (let i = 0; i < 3; i++){
        const dx = (R() - .5) * 10, L = 12 + R() * 9;
        el("path", { d: `M${f1(t.x)} ${f1(t.y)}q${f1(dx * .2)} ${f1(L * .5)} ${f1(dx)} ${f1(L)}` }, parts.catkins);
      }
    });

    /* acorns on the tree */
    const ag = el("g", {}, svg);
    tree.tips.forEach(t => {
      const near = Math.hypot(t.x - focusPoints.acorns.x, t.y - focusPoints.acorns.y) < 70;
      if (!(near || R() < .1)) return;
      const g = el("g", {}, ag);
      g.innerHTML = `<path d="M0 0 Q1 6 2 11" stroke="var(--trunk)" stroke-width=".9" fill="none"/>
        <g transform="translate(2 11) rotate(-14)"><ellipse class="nut" cx="0" cy="4.2" rx="2.6" ry="3.9"/><path class="cup" d="M-2.9 2 Q-3 -.6 0 -.6 Q3 -.6 2.9 2Z"/></g>
        <g transform="translate(2 11) rotate(22)"><ellipse class="nut" cx="0" cy="4.2" rx="2.6" ry="3.9"/><path class="cup" d="M-2.9 2 Q-3 -.6 0 -.6 Q3 -.6 2.9 2Z"/></g>`;
      acornEls.push({ g, x: t.x, y: t.y, t: R(), nuts: g.querySelectorAll(".nut"), cups: g.querySelectorAll(".cup") });
    });

    parts.particles = el("g", { id: "particles" }, svg);
    parts.ring = el("circle", { r: 16, class: "focus-ring" }, svg);
    parts.bbox = computeBBox();
  }

  function computeBBox(){
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    [...tree.segs, ...roots.segs].forEach(s => {
      x0 = Math.min(x0, s.x2); x1 = Math.max(x1, s.x2); y0 = Math.min(y0, s.y2); y1 = Math.max(y1, s.y2);
    });
    return { x0: x0 - 30, x1: x1 + 30, y0: y0 - 30, y1: y1 + 20 };
  }

  let lastM = -1;
  function update(m){
    if (Math.abs(m - lastM) < .004) return;
    lastM = m;
    const ph = Phenology.at(m);
    document.documentElement.style.setProperty("--accent", ph.accent);
    document.documentElement.dataset.season = seasonOf(m);

    const base = ph.leafColor;
    const shades = [mix(base, "#1c2a14", .22), base, mix(base, "#f4f0c8", .18)];
    leafGroups.forEach((g, i) => g.setAttribute("fill", shades[i]));
    const L = ph.leaf;
    for (const l of leafEls){
      const v = clamp((L * 1.12 - l.t) / .12);
      l.c.setAttribute("r", f1(l.r0 * (.3 + .7 * v)));
      l.c.setAttribute("opacity", f1(v));
    }
    parts.catkins.setAttribute("opacity", f1(ph.catkin));
    const nut = mix("#8fa650", "#86522a", ph.acornRipe), cup = mix("#76903f", "#9b8059", ph.acornRipe);
    for (const a of acornEls){
      const v = clamp((ph.acorn * 1.1 - a.t * .9) / .15);
      const s = (.3 + .7 * clamp(ph.acorn * 1.3)) * .95;
      a.g.setAttribute("transform", `translate(${f1(a.x)} ${f1(a.y)}) scale(${f1(s * 100) / 100})`);
      a.g.setAttribute("opacity", f1(v));
      a.nuts.forEach(n => n.setAttribute("fill", nut));
      a.cups.forEach(c => c.setAttribute("fill", cup));
    }
    for (const a of groundAcorns) a.e.setAttribute("opacity", f1(clamp((ph.acornGround * 1.1 - a.t) / .15)));
    for (const mu of mushrooms){
      const s = mu.s * ph.mushroom;
      mu.g.setAttribute("transform", `translate(${mu.x} ${G}) scale(${f1(s * 100) / 100})`);
      mu.g.setAttribute("opacity", s > .02 ? 1 : 0);
    }
    parts.grass.setAttribute("fill", ph.grass);
    parts.snowGround.setAttribute("opacity", f1(ph.snow));
    parts.snowBr.setAttribute("opacity", f1(clamp(ph.snow * 1.2)));
    parts.hyphae.setAttribute("opacity", f1(ph.hyphae * .75));
    Particles.setRates(ph);
  }

  function focus(id){
    const p = id && focusPoints[id];
    if (p){ parts.ring.setAttribute("cx", f1(p.x)); parts.ring.setAttribute("cy", f1(p.y)); }
    parts.ring.classList.toggle("on", !!p);
  }
  return { build, update, focus, svg, focusPoints, get bbox(){ return parts.bbox; }, get particles(){ return parts.particles; } };
})();

/* =========================================================================
   PARTICLES — falling leaves & snow (ambient, respects reduced motion)
   ========================================================================= */
const Particles = (() => {
  const list = []; let leafRate = 0, snowRate = 0, color = "#a06a30", accL = 0, accS = 0;
  const G = CONFIG.world.ground;
  function setRates(ph){ leafRate = ph.leafFall * 5 * ph.leaf; snowRate = ph.snowfall * 26; color = ph.leafColor; }
  function spawn(kind){
    const g = Scene.particles; if (!g) return;
    if (kind === "leaf"){
      const x = 330 + Math.random() * 560, y = 160 + Math.random() * 260;
      const e = el("ellipse", { rx: 4.5, ry: 2.4, fill: color }, g);
      list.push({ e, kind, x, y, vy: 26 + Math.random() * 22, ph: Math.random() * 6, rot: Math.random() * 360 });
    } else {
      const x = -100 + Math.random() * 1400, y = -40;
      const e = el("circle", { r: f1(1.4 + Math.random() * 1.8), fill: "#ffffff", stroke: "rgba(110,125,135,.35)", "stroke-width": .5 }, g);
      list.push({ e, kind, x, y, vy: 32 + Math.random() * 26, ph: Math.random() * 6 });
    }
  }
  function tick(dt){
    if (reducedMotion) return;
    accL += leafRate * dt; accS += snowRate * dt;
    while (accL > 1 && list.length < 60){ spawn("leaf"); accL--; }
    while (accS > 1 && list.length < 140){ spawn("snow"); accS--; }
    accL = Math.min(accL, 1); accS = Math.min(accS, 1);
    for (let i = list.length - 1; i >= 0; i--){
      const p = list[i];
      p.ph += dt * (p.kind === "leaf" ? 2.2 : 1.2);
      p.y += p.vy * dt;
      const sx = Math.sin(p.ph) * (p.kind === "leaf" ? 16 : 8);
      if (p.kind === "leaf"){ p.rot += dt * 120; p.e.setAttribute("transform", `translate(${f1(p.x + sx)} ${f1(p.y)}) rotate(${f1(p.rot)})`); }
      else { p.e.setAttribute("cx", f1(p.x + sx)); p.e.setAttribute("cy", f1(p.y)); }
      const offSeason = p.kind === "leaf" ? leafRate < .05 : snowRate < .2;
      if (offSeason){ p.fade = (p.fade ?? 1) - dt * 2.5; p.e.setAttribute("opacity", f1(Math.max(0, p.fade))); }
      if (p.y > G - 3 || p.fade <= 0){ p.e.remove(); list.splice(i, 1); }
    }
  }
  return { setRates, tick };
})();

/* =========================================================================
   CAMERA — animated viewBox
   ========================================================================= */
const Camera = (() => {
  const svg = $("#scene");
  let cur = null, from = null, to = null, t0 = 0, dur = 950, moving = false;
  function homeView(){
    const b = Scene.bbox, wrap = $("#sceneWrap");
    const asp = wrap.clientHeight / Math.max(1, wrap.clientWidth);
    let w = (b.x1 - b.x0), h = (b.y1 - b.y0);
    /* leave headroom for the month heading in the sky */
    const top = b.y0 - h * .16;
    h = b.y1 - top;
    if (h / w < asp) h = w * asp; else w = h / asp;
    const cx = (b.x0 + b.x1) / 2;
    return { x: cx - w / 2, y: top, w, h };
  }
  function focusView(p, wWorld){
    const wrap = $("#sceneWrap");
    const asp = wrap.clientHeight / Math.max(1, wrap.clientWidth);
    const w = wWorld, h = w * asp;
    return { x: p.x - w / 2, y: p.y - h / 2, w, h };
  }
  function apply(v){ svg.setAttribute("viewBox", `${f1(v.x)} ${f1(v.y)} ${f1(v.w)} ${f1(v.h)}`); cur = v; }
  function go(v, instant){
    if (instant || reducedMotion || !cur){ apply(v); moving = false; Hotspots.place(); return; }
    from = { ...cur }; to = v; t0 = performance.now(); moving = true;
  }
  function tick(now){
    if (!moving) return false;
    const t = clamp((now - t0) / dur), e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    /* zoom in log space for a natural feel */

})();

function magnifier(cx, cy, r, inner){
  const id = "clip" + (++UID);

    <circle cx="${cx}" cy="${cy}" r="${r}" class="mag-bg"/><g clip-path="url(#${id})">${inner}</g>
    <circle cx="${cx}" cy="${cy}" r="${r}" class="mag-ring"/>`;
}
function loupe(x, y, cx, cy, r){
  const a = Math.atan2(y - cy, x - cx);
  return `<circle cx="${x}" cy="${y}" r="9" class="loupe"/><line x1="${f1(x - Math.cos(a) * 9)}" y1="${f1(y - Math.sin(a) * 9)}" x2="${f1(cx + Math.cos(a) * r)}" y2="${f1(cy + Math.sin(a) * r)}" class="loupe"/>`;
}
function oakLeafPath(len, wid, lobes = 5, phase = .08){
  const N = 90, Rt = [], Lt = [];
  for (let i = 0; i <= N; i++){
    const t = i / N;
    const env = Math.pow(Math.sin(Math.PI * Math.pow(t, 1.25)), .9);
    const aur = .3 * Math.exp(-Math.pow((t - .05) / .035, 2));
    const lr = .58 + .42 * Math.pow(Math.abs(Math.sin(Math.PI * lobes * t)), .7);
    const ll = .58 + .42 * Math.pow(Math.abs(Math.sin(Math.PI * (lobes * t + phase))), .7);
    Rt.push([wid * (env * lr + aur), -t * len]); Lt.push([-wid * (env * ll + aur), -t * len]);
  }
  let d = "M0 0";
  Rt.forEach(p => d += `L${f1(p[0])} ${f1(p[1])}`);
  for (let i = N; i >= 0; i--) d += `L${f1(Lt[i][0])} ${f1(Lt[i][1])}`;
  return d + "Z";
}
function oakLeaf(len, wid, fill, opts = {}){

    const env = Math.pow(Math.sin(Math.PI * Math.pow(t, 1.25)), .9);
    const x = wid * env * .82, y = -t * len, y0 = -(t - .07) * len;
    veins += `<path d="M0 ${f1(y0)} Q${f1(x * .5)} ${f1(y0 - len * .03)} ${f1(x)} ${f1(y)} M0 ${f1(y0 + len * .02)} Q${f1(-x * .5)} ${f1(y0 - len * .02)} ${f1(-x)} ${f1(y + len * .015)}" stroke="${vein}" stroke-width="${f1(len / 170)}" fill="none" opacity=".8"/>`;
  }
  return `<path d="M0 0 L0 7" stroke="${vein}" stroke-width="${f1(len / 70)}" stroke-linecap="round"/><path d="${oakLeafPath(len, wid)}" fill="${fill}"/>${veins}`;
}
function budShape(s, fill, line){

function acornShape(s, ripe){

function beads(x, y, dx, len, color, n){
  let out = "";

function budSection(cx, baseY, H, W, opts = {}){

      ctx.mark(MX + 28, 118, ["", "Next year’s leaves", "Leaf primordia"], 1);
      ctx.mark(MX - 27, 112, ["", "Bud scales"], 1);
    }
    return b;
  }
});

/* ---------- WOOD ---------- */
App.registerTopic({
  id: "wood", glyph: "rings", zoom: 520,
  illustrate(ctx){
    const s = ctx.season, rng = ctx.rng;
    const C = [180, 404], A1 = -118, A2 = -62;
    const pol = (r, a) => [C[0] + r * Math.cos(a * Math.PI / 180), C[1] + r * Math.sin(a * Math.PI / 180)];
    const P = (r, a) => pol(r, a).map(f1).join(" ");
    const sector = (r1, r2, a1 = A1, a2 = A2) => `M${P(r2, a1)} A${r2} ${r2} 0 0 1 ${P(r2, a2)} L${P(r1, a2)} A${r1} ${r1} 0 0 0 ${P(r1, a1)}Z`;
    const prog = { spring: .35, summer: .72, autumn: 1, winter: 1 }[s];
    const RW = 22, R0 = 186, NR = 7, CAMB = R0 + RW * NR;
    let b = "";
    for (let i = 0; i < NR; i++){
      const r0 = R0 + i * RW, heart = i < 3, cur = i === NR - 1;
      const ew = heart ? "#cfa46c" : "#ead9b4", lw = heart ? "#a87a45" : "#c9a674";
      const width = cur ? RW * prog : RW;
      b += `<path d="${sector(r0, r0 + Math.min(width, 8))}" fill="${ew}"/>`;
      if (width > 8) b += `<path d="${sector(r0 + 8, r0 + width)}" fill="${lw}"/>`;
      /* earlywood vessels */
      const step = 9 / (r0 + 4) * 180 / Math.PI;
      for (let a = A1 + step * .6; a < A2 - step * .3; a += step){
        const [x, y] = pol(r0 + 4 + (rng() - .5) * 2, a + (rng() - .5) * step * .4);
        let fill = "#2f2924";
        if (cur && s !== "winter") fill = "#6f97b3";
        if (heart) fill = "#9b7444";
        b += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(2.6 + rng() * .8)}" fill="${fill}"/>`;
        if (heart) b += `<circle cx="${f1(x - .6)}" cy="${f1(y - .4)}" r=".9" fill="#d8b783"/><circle cx="${f1(x + .8)}" cy="${f1(y + .6)}" r=".8" fill="#d8b783"/>`;
      }
      if (width > 12){
        const st = 13 / (r0 + 15) * 180 / Math.PI;
        for (let a = A1 + st * .5; a < A2; a += st){ const [x, y] = pol(r0 + 11 + rng() * Math.max(1, width - 13), a); b += `<circle cx="${f1(x)}" cy="${f1(y)}" r=".9" fill="${cur && s !== "winter" ? "#6f97b3" : "#5a4a3a"}"/>`; }
      }
    }
    if (prog < 1) b += `<path d="${sector(R0 + (NR - 1) * RW + RW * prog, CAMB)}" fill="#f3ebd6"/>`;
    for (let a = A1 + 2; a < A2; a += 3.4){
      const broad = Math.round((a - A1) / 3.4) % 5 === 2;
      b += `<path d="M${P(R0, a)} L${P(CAMB, a)}" stroke="${broad ? "#e9d6ae" : "#b5915f"}" stroke-width="${broad ? 2.4 : .5}" opacity="${broad ? .9 : .7}"/>`;
    }
    const active = s === "spring" || s === "summer";
    b += `<path d="${sector(CAMB, CAMB + 2.5)}" fill="${active ? ctx.ph.accent : "#9a9a8a"}"/>`;
    b += `<path d="${sector(CAMB + 2.5, CAMB + 8)}" fill="#b58a5c"/>`;
    let bark = `M${P(CAMB + 8, A1)}`;
    for (let a = A1; a <= A2 + .01; a += 1.2){ const r = CAMB + 34 + (Math.round(a) % 4 === 0 ? -14 : rng() * 7); bark += ` L${P(r, a)}`; }
    bark += ` L${P(CAMB + 8, A2)} A${CAMB + 8} ${CAMB + 8} 0 0 0 ${P(CAMB + 8, A1)}Z`;
    b += `<path d="${bark}" fill="#5c4736"/>`;
    for (let a = A1 + 3; a < A2; a += 5) b += `<path d="M${P(CAMB + 12, a)} L${P(CAMB + 26, a + 1)}" stroke="#3f3026" stroke-width="1"/>`;

    const m = (r, a, t, min) => { const [x, y] = pol(r, a); ctx.mark(x, y, t, min); };
    m(CAMB + 24, -112, ["Bark", "Outer bark", "Outer bark (rhytidome)"]);
    m(CAMB + 1, -66, [active ? "Growth layer (active)" : "Growth layer (resting)", active ? "Cambium (active)" : "Cambium (dormant)", active ? "Vascular cambium (active)" : "Vascular cambium (dormant)"]);
    m(CAMB + 5, -96, ["", "Phloem (inner bark)", "Secondary phloem"], 1);
    m(R0 + (NR - 1) * RW + 4, -84, s === "winter"
      ? ["Big tubes, now air-filled", "Spring vessels, blocked by air", "Earlywood vessels (embolised)", "Earlywood vessels (freeze–thaw embolism)"]
      : ["Big water tubes", "Spring wood: big vessels", "Earlywood vessels (ring-porous)", "Earlywood vessels (current-year conductance)"]);
    if (prog > .4) m(R0 + (NR - 2) * RW + 16, -104, ["", "Summer wood", "Latewood fibres", "Latewood (thick-walled fibres)"], 1);
    m(R0 + (NR - 3) * RW + 11, -70, ["One year of growth", "Annual growth ring", "Annual ring (earlywood + latewood)"]);
    m(R0 + 2 * RW + 6, -99, ["", "", "Heartwood", "Heartwood with tylose-plugged vessels"], 2);
    m(R0 + 4 * RW + 10, -88.9, ["", "", "Broad ray", "Multiseriate ray"], 2);
    if (prog < 1) m(R0 + (NR - 1) * RW + RW * prog + 4, -78, ["", "", "New wood forming", "Differentiating xylem zone"], 2);
    return b;
  }
});

/* ---------- ROOTS ---------- */
App.registerTopic({
  id: "roots", glyph: "roots", zoom: 640,
  illustrate(ctx){
    const s = ctx.season, rng = ctx.rng;
    const MX = 268, MY = 126, MR = 84, SY = 48;
    let b = `<path d="M0 ${SY} L180 ${SY - 2} L180 220 L0 220Z" fill="#9b8263"/><path d="M0 ${SY} L180 ${SY - 2} L180 ${SY + 8} L0 ${SY + 10}Z" fill="#6b5640"/>`;
    if (s === "winter") b += `<path d="M0 ${SY + 10} L180 ${SY + 8} L180 ${SY + 30} L0 ${SY + 32}Z" fill="#c9d6dc" opacity=".55"/><path d="M0 ${SY - 1} C40 ${SY - 12} 120 ${SY - 10} 180 ${SY - 6} L180 ${SY} L0 ${SY + 2}Z" fill="#f7faf9"/>`;
    const tips = [];
    (function br(x, y, a, len, w, d){
      const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
      b += `<path d="M${f1(x)} ${f1(y)} Q${f1(x + Math.cos(a + .3) * len * .5)} ${f1(y + Math.sin(a + .3) * len * .5)} ${f1(x2)} ${f1(y2)}" stroke="#5f4635" stroke-width="${f1(w)}" fill="none" stroke-linecap="round"/>`;
      if (d >= 4 || x2 > 170){ tips.push([x2, y2, a]); return; }
      br(x2, y2, a - .5 + rng() * .2, len * .74, w * .62, d + 1);
      br(x2, y2, a + .45 + rng() * .2, len * .74, w * .62, d + 1);
    })(20, SY + 6, .9, 52, 9, 0);
    const hyN = s === "summer" ? 7 : s === "winter" ? 3 : 5;
    tips.forEach(([x, y, a], i) => {
      const fresh = s === "spring" && i % 2 === 0;
      b += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="4.2" ry="2.8" transform="rotate(${f1(a * 180 / Math.PI)} ${f1(x)} ${f1(y)})" fill="${fresh ? "#fbf7ea" : "#e6d6b0"}" stroke="#bfa36a" stroke-width=".6"/>`;
      for (let k = 0; k < hyN; k++){ const ha = a + (rng() - .5) * 3, L = 10 + rng() * 14; b += `<path d="M${f1(x)} ${f1(y)} q${f1(Math.cos(ha + .5) * L * .5)} ${f1(Math.sin(ha + .5) * L * .5)} ${f1(Math.cos(ha) * L)} ${f1(Math.sin(ha) * L)}" stroke="#fbf8ef" stroke-width=".7" fill="none" opacity=".9"/>`; }
    });
    if (s === "autumn"){
      [[64, 1], [120, .75]].forEach(([x, k]) => { b += `<g transform="translate(${x} ${SY}) scale(${k})"><rect x="-4" y="-22" width="8" height="22" rx="3" fill="#efe5d0"/><path d="M-20 -20 Q0 -46 20 -20 Q0 -16 -20 -20Z" fill="#8b5a2b"/></g>`; });
    }
    const [tx, ty] = tips[Math.min(tips.length - 1, 5)];
    b += loupe(f1(tx), f1(ty), MX, MY, MR);
    let x = `<rect x="150" y="0" width="240" height="250" fill="#a58c6a"/>`;
    for (let i = 0; i < 26; i++){ const a = rng() * Math.PI * 2; x += `<path d="M${f1(MX + Math.cos(a) * 66)} ${f1(MY + Math.sin(a) * 66)} q${f1(Math.cos(a + .6) * 8)} ${f1(Math.sin(a + .6) * 8)} ${f1(Math.cos(a) * 22)} ${f1(Math.sin(a) * 22)}" stroke="#fbf8ef" stroke-width=".9" fill="none"/>`; }
    x += `<circle cx="${MX}" cy="${MY}" r="66" fill="#efe4c8"/>`;
    for (let i = 0; i < 40; i++){ const a = rng() * Math.PI * 2, r = 57 + rng() * 8; x += `<path d="M${f1(MX + Math.cos(a) * r)} ${f1(MY + Math.sin(a) * r)} a3 3 0 0 1 4 2" stroke="#c9ad6d" stroke-width=".7" fill="none"/>`; }
    const hn = ctx.ph.accent;
    [[46, 16, 7.4], [32, 11, 7]].forEach(([r, n, cr]) => {
      for (let i = 0; i < n; i++){ const a = i / n * Math.PI * 2 + r; x += `<circle cx="${f1(MX + Math.cos(a) * r)}" cy="${f1(MY + Math.sin(a) * r)}" r="${cr}" fill="#f7f0e2" stroke="${s === "winter" ? "#b9a77a" : "#c49a3e"}" stroke-width="${s === "summer" ? 2.2 : 1.6}"/>`; }
    });
    x += `<circle cx="${MX}" cy="${MY}" r="21" fill="#e6d7ad" stroke="#a8915a" stroke-width="1.2"/>`;
    [0, 1, 2, 3].forEach(i => { const a = i * Math.PI / 2 + .4; x += `<circle cx="${f1(MX + Math.cos(a) * 10)}" cy="${f1(MY + Math.sin(a) * 10)}" r="3.2" fill="#6f5a3a"/><circle cx="${f1(MX + Math.cos(a + .78) * 11)}" cy="${f1(MY + Math.sin(a + .78) * 11)}" r="2" fill="#b4925a"/>`; });
    b += magnifier(MX, MY, MR, x);
    ctx.mark(46, 74, ["Root", "Woody root", "Coarse root (starch store)"]);
    ctx.mark(f1(tx + 16), f1(ty - 14), ["Fungal threads", "Fungal hyphae", "Extramatrical mycelium"]);
    ctx.mark(f1(tx - 18), f1(ty + 2), ["", "Mycorrhizal root tip", "Ectomycorrhizal root tip"], 1);
    if (s === "autumn") ctx.mark(64, SY - 36, ["Mushroom", "Mushroom (fungal fruit)", "EM sporocarp (bolete)"]);
    if (s === "winter") ctx.mark(150, SY + 20, ["Frozen topsoil", "Frozen topsoil, under snow"]);
    if (s === "spring") ctx.mark(tips[0][0] + 8, tips[0][1] + 8, ["New white root tip", "New root tip"]);
    ctx.mark(MX + 50, MY - 46, ["", "Fungal sheath", "Fungal mantle", "Hyphal mantle"], 1);
    ctx.mark(MX + 34, MY + 30, ["", "", "Hartig net between cortex cells", "Hartig net (exchange interface)"], 2);
    ctx.mark(MX - 36, MY + 34, ["", "", "Root cortex", "Cortex (angiosperm Hartig net is mostly epidermal)"], 2);
    ctx.mark(MX, MY, ["", "", "", "Stele (tetrarch xylem)"], 3);
    return b;
  }
});

/* glyphs for the topic list */
const GLYPHS = {
  leaf: `<g transform="translate(10 18.5) rotate(-35) scale(.95)">${"<path d='" + oakLeafPath(16, 5.5) + "' fill='var(--accent)'/>"}</g>`,
  bud: `<g transform="translate(10 17)">${budShape(13, "var(--ink)", "var(--surface-2)")}</g>`,
  catkin: `<path d="M5 3 Q10 3 15 4" stroke="var(--ink)" stroke-width="1.4" fill="none"/>${beads(8, 4, -1, 13, "var(--ink)", 6).replace(/r="[\d.]+"/g, 'r="1.5"')}${beads(12, 4, 1, 11, "var(--ink)", 5).replace(/r="[\d.]+"/g, 'r="1.5"')}`,
  acorn: `<g transform="translate(10 3.5)">${acornShape(11, 1).replace(/fill="#[0-9a-f]{6}"/g, 'fill="var(--ink)"').replace(/fill="#fff"/g, 'fill="var(--surface-2)"')}</g>`,
  rings: `<circle cx="10" cy="10" r="8.5" fill="none" stroke="var(--ink)" stroke-width="1.4"/><circle cx="10" cy="10" r="5.5" fill="none" stroke="var(--ink)" stroke-width="1"/><circle cx="10" cy="10" r="2.5" fill="var(--ink)"/>`,
  roots: `<path d="M3 5 H17 M10 5 V10 M10 10 Q6 13 4 17 M10 10 Q14 13 16 17 M10 10 V17" stroke="var(--ink)" stroke-width="1.4" fill="none" stroke-linecap="round"/>`
};

/* =========================================================================
   HOTSPOTS — HTML overlay mapped from world coordinates
   ========================================================================= */
const Hotspots = (() => {
  const layer = $("#hotspots"), svg = $("#scene");
  const btns = new Map();
  function build(){
    layer.innerHTML = "";
    Topics.forEach((t, id) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "hs";
      const name = CONTENT.topics[id].name;
      b.setAttribute("aria-label", `Look closer: ${name}`);
      b.innerHTML = `<span class="hs-dot"></span><span class="hs-label">${esc(name)}</span>`;
      b.addEventListener("click", () => store.set({ topic: id }));
      layer.appendChild(b); btns.set(id, b);
    });
  }
  function place(){
    const m = svg.getScreenCTM(); if (!m) return;
    const r = layer.getBoundingClientRect(), pt = svg.createSVGPoint();
    btns.forEach((b, id) => {
      const p = Scene.focusPoints[id]; pt.x = p.x; pt.y = p.y;
      const s = pt.matrixTransform(m);
      const x = s.x - r.left, y = s.y - r.top;
      b.style.left = x + "px"; b.style.top = y + "px";
      b.classList.toggle("flip", x > r.width * .62);
    });
  }
  return { build, place, setVisible(v){ layer.classList.toggle("off", !v); } };
})();

/* =========================================================================
   GLOSSARY — auto-link terms, one tooltip
   ========================================================================= */
const Glossary = (() => {
  const index = [];
  for (const term in GLOSSARY) GLOSSARY[term].match.forEach(m => index.push([m, term]));
  index.sort((a, b) => b[0].length - a[0].length);
  const lookup = new Map(index.map(([m, t]) => [m.toLowerCase(), t]));
  const re = new RegExp(`\\b(${index.map(([m]) => m.replace(/[.*+?^${}()|[\]\\-]/g, "\\$&")).join("|")})\\b`, "gi");
  const tip = $("#tip");
  function linkify(text){
    const used = new Set();
    return esc(text).replace(re, (w) => {
      const t = lookup.get(w.toLowerCase());
      if (!t || used.has(t)) return w;
      used.add(t);
      return `<button type="button" class="term" data-term="${esc(t)}">${w}</button>`;
    });
  }
  function show(btn){
    const t = btn.dataset.term, g = GLOSSARY[t]; if (!g) return;
    tip.innerHTML = `<b>${esc(t.charAt(0).toUpperCase() + t.slice(1))}</b>${esc(g.def)}`;
    tip.classList.add("on");
    const r = btn.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = r.left + r.width / 2 - tw / 2; x = clamp(x, 8, window.innerWidth - tw - 8);
    let y = r.bottom + 8; if (y + th > window.innerHeight - 8) y = r.top - th - 8;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hide(){ tip.classList.remove("on"); }
  document.addEventListener("mouseover", e => { const b = e.target.closest(".term"); if (b) show(b); });
  document.addEventListener("mouseout", e => { if (e.target.closest(".term")) hide(); });
  document.addEventListener("focusin", e => { const b = e.target.closest(".term"); if (b) show(b); });
  document.addEventListener("focusout", e => { if (e.target.closest(".term")) hide(); });
  document.addEventListener("click", e => { const b = e.target.closest(".term"); if (b) show(b); else hide(); });
  $("#panel").addEventListener("scroll", hide, { passive: true });
  return { linkify, hide };
})();

/* =========================================================================
   PANEL — intro view and topic view
   ========================================================================= */
const Panel = (() => {
  const root = $("#panelInner");
  let lastKey = "";
  function textFor(topicId, season, level){
    const seasons = CONTENT.topics[topicId]?.seasons?.[season];
    if (!seasons) return null;
    for (let i = LEVEL_INDEX[level]; i >= 0; i--){ const t = seasons[LEVELS[i].id]; if (t) return t; }
    return null;
  }
  function pips(li){ return `<span class="pips" aria-hidden="true">${LEVELS.map((_, i) => `<i class="${i <= li ? "on" : ""}"></i>`).join("")}</span>`; }

  function renderIntro(s){
    const items = [...Topics.keys()].map(id => {
      const t = CONTENT.topics[id], g = GLYPHS[Topics.get(id).glyph] || "";
      return `<li><button type="button" data-topic="${id}"><span class="tl-glyph"><svg viewBox="0 0 20 20" aria-hidden="true">${g}</svg></span><span class="tl-name">${esc(t.name)}</span><span class="tl-blurb">${esc(t.blurb)}</span><span class="tl-arrow" aria-hidden="true">›</span></button></li>`;
    }).join("");
    root.className = "panel-inner intro enter";
    root.innerHTML = `
      <h2>${esc(STRINGS.introTitle)}</h2>
      <p class="lede">${esc(STRINGS.introLede)}</p>
      <p class="follow-label">${esc(STRINGS.explore)}</p>
      <ul class="topic-list">${items}</ul>
      <p class="hint">${esc(STRINGS.hint)}</p>`;
    root.querySelectorAll("[data-topic]").forEach(b => b.addEventListener("click", () => store.set({ topic: b.dataset.topic })));
  }

  function renderTopic(s){
    const id = s.topic, topic = Topics.get(id), data = CONTENT.topics[id];
    const season = seasonOf(s.month), li = LEVEL_INDEX[s.level], mi = Math.floor(s.month) % 12;
    const ctx = makeCtx(s);
    const svgBody = topic.illustrate(ctx) + ctx.marks;
    const legend = ctx.labels.map(l => `<li>${esc(l)}</li>`).join("");
    const text = textFor(id, season, s.level);
    const tabs = SEASONS.map(se => `<button type="button" data-season="${se.id}" aria-pressed="${se.id === season}">${se.label}</button>`).join("");
    const deeper = li < LEVELS.length - 1 ? `<button type="button" class="chip primary" data-level="${LEVELS[li + 1].id}">${esc(STRINGS.deeper(LEVELS[li + 1].label))}</button>` : "";
    const simpler = li > 0 ? `<button type="button" class="chip" data-level="${LEVELS[li - 1].id}">${esc(STRINGS.simpler(LEVELS[li - 1].label))}</button>` : "";
    const related = (data.related || []).filter(r => Topics.has(r)).map(r => `<button type="button" class="chip" data-topic="${r}">${esc(CONTENT.topics[r].name)}</button>`).join("");
    root.className = "panel-inner enter";
    root.innerHTML = `
      <div class="crumb">
        <button type="button" class="link" data-home>
          <svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>${esc(STRINGS.wholeTree)}
        </button>
        <span class="when">${MONTHS[mi]}, ${SEASONS.find(x => x.id === season).label.toLowerCase()}</span>
      </div>
      <h2>${esc(data.name)}</h2>
      <p class="lede">${esc(data.blurb)}</p>
      <figure class="ill">
        <svg ${VB} role="img" aria-label="${esc(data.name)} in ${season}: ${esc(ctx.labels.join(", "))}">${svgBody}</svg>
        ${legend ? `<ol class="legend">${legend}</ol>` : ""}
      </figure>
      <div class="follow">
        <p class="follow-label">${esc(STRINGS.follow)}</p>
        <div class="tabs">${tabs}</div>
      </div>
      <div class="reading">
        <p class="reading-level">${pips(li)}${esc(LEVELS[li].label)}</p>
        <p class="text">${text ? Glossary.linkify(text) : esc(STRINGS.missing)}</p>
        <div class="depth">${deeper}${simpler}</div>
      </div>
      ${related ? `<div class="related"><p>${esc(STRINGS.seeAlso)}</p><div class="depth">${related}</div></div>` : ""}`;
    root.querySelector("[data-home]").addEventListener("click", () => store.set({ topic: null }));
    root.querySelectorAll("[data-season]").forEach(b => b.addEventListener("click", () => {
      store.set({ month: SEASONS.find(x => x.id === b.dataset.season).rep, playing: false });
    }));
    root.querySelectorAll("[data-level]").forEach(b => b.addEventListener("click", () => store.set({ level: b.dataset.level })));
    root.querySelectorAll(".related [data-topic]").forEach(b => b.addEventListener("click", () => store.set({ topic: b.dataset.topic })));
  }

  function render(s, force){
    const mi = Math.floor(s.month) % 12;
    const key = `${s.topic}|${s.level}|${s.topic ? mi : ""}`;
    if (key === lastKey && !force) return;
    const animate = key.split("|")[0] !== lastKey.split("|")[0];
    lastKey = key;
    Glossary.hide();
    s.topic ? renderTopic(s) : renderIntro(s);
    if (!animate) root.classList.remove("enter");
    if (animate) $("#panel").scrollTop = 0;
  }
  return { render };
})();

/* =========================================================================
   CONTROLS — level switch, timeline, play
   ========================================================================= */
const Controls = (() => {
  const seg = $("#levelSeg"), range = $("#monthRange"), monthBtns = $("#monthBtns"), play = $("#playBtn"), back = $("#backBtn");
  const icons = { play: `<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9.5-5.5z"/></svg>`, pause: `<svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="1.5" width="3.2" height="11" rx="1"/><rect x="8.3" y="1.5" width="3.2" height="11" rx="1"/></svg>` };
  function build(){
    seg.innerHTML = LEVELS.map(l => `<button type="button" role="radio" data-level="${l.id}"><span class="long">${l.label}</span><span class="short">${l.short}</span></button>`).join("");
    seg.addEventListener("click", e => { const b = e.target.closest("[data-level]"); if (b) store.set({ level: b.dataset.level }); });
    seg.addEventListener("keydown", e => {
      if (!["ArrowLeft", "ArrowRight"].includes(e.key)) return;
      const i = LEVEL_INDEX[store.get().level] + (e.key === "ArrowRight" ? 1 : -1);
      if (i >= 0 && i < LEVELS.length){ store.set({ level: LEVELS[i].id }); seg.querySelector(`[data-level="${LEVELS[i].id}"]`).focus(); }
      e.preventDefault();
    });
    monthBtns.innerHTML = MONTHS.map((m, i) => `<button type="button" data-m="${i}" aria-label="${m}">${m[0]}</button>`).join("");
    monthBtns.addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (b) store.set({ month: +b.dataset.m + .5, playing: false }); });
    range.addEventListener("input", () => store.set({ month: +range.value, playing: false }));
    play.addEventListener("click", () => store.set({ playing: !store.get().playing }));
    back.addEventListener("click", () => store.set({ topic: null }));
    document.addEventListener("keydown", e => { if (e.key === "Escape" && store.get().topic) store.set({ topic: null }); });
  }
  function sync(s){
    seg.querySelectorAll("[data-level]").forEach(b => { const on = b.dataset.level === s.level; b.setAttribute("aria-checked", on); b.tabIndex = on ? 0 : -1; });
    if (document.activeElement !== range) range.value = s.month.toFixed(2);
    const mi = Math.floor(s.month) % 12;
    monthBtns.querySelectorAll("[data-m]").forEach((b, i) => b.setAttribute("aria-current", i === mi));
    play.innerHTML = s.playing ? icons.pause : icons.play;
    play.setAttribute("aria-label", s.playing ? "Pause" : "Play the year");
    range.setAttribute("aria-valuetext", MONTHS[mi]);
    back.classList.toggle("on", !!s.topic);
    $(".moment").classList.toggle("off", !!s.topic);
    $("#mMonth").textContent = MONTHS[mi];
    $("#mSeason").textContent = SEASONS.find(x => x.id === seasonOf(s.month)).label;
    $("#mNote").textContent = MONTH_NOTES[mi];
  }
  return { build, sync };
})();

/* =========================================================================
   WIRING
   ========================================================================= */
function cameraFor(s){
  if (!s.topic) return Camera.homeView();
  const t = Topics.get(s.topic), p = Scene.focusPoints[s.topic], k = t.pull || 0;
  /* pull the view slightly toward the crown so the focus sits in context */
  const c = { x: CONFIG.world.cx, y: 330 };
  return Camera.focusView({ x: lerp(p.x, c.x, k), y: lerp(p.y, c.y, k) }, t.zoom || 400);
}

store.subscribe((s, prev) => {
  if (s.month !== prev.month) Scene.update(s.month);
  if (s.level !== prev.level) storage.set("oakyear.level", s.level);
  if (s.topic !== prev.topic){
    Camera.go(cameraFor(s)); Hotspots.setVisible(!s.topic); Scene.focus(s.topic);
    if (s.topic && !prev.topic && window.matchMedia("(max-width: 860px)").matches){
      setTimeout(() => {
        const r = $("#panel").getBoundingClientRect();
        if (r.top > window.innerHeight * .7) window.scrollTo({ top: window.scrollY + r.top - window.innerHeight * .38, behavior: reducedMotion ? "auto" : "smooth" });
      }, reducedMotion ? 0 : 900);
    }
  }
  Controls.sync(s);
  Panel.render(s);
});

function init(){
  Scene.build();
  Hotspots.build();
  Controls.build();
  const s = store.get();
  Scene.update(s.month);
  Controls.sync(s);
  Panel.render(s, true);
  $("#brandLeaf").setAttribute("d", oakLeafPath(26, 8.5));
  $("#brandLeaf").setAttribute("transform", "translate(13 31) rotate(28)");
  requestAnimationFrame(() => { Camera.go(cameraFor(s), true); Hotspots.place(); });

  let resizeT;
  new ResizeObserver(() => { clearTimeout(resizeT); resizeT = setTimeout(() => { Camera.go(cameraFor(store.get()), true); }, 60); }).observe($("#sceneWrap"));

  let last = performance.now();
  function frame(t){
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    const st = store.get();
    if (st.playing) store.set({ month: (st.month + dt * CONFIG.monthsPerSecond) % 12 });
    if (Camera.tick(t)) Hotspots.place();
    if (!document.hidden) Particles.tick(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
init();
})();
</script>
